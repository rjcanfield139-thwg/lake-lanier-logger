name: Log Lake Lanier

on:
  # Main trigger: cron-job.org calls this every hour at :00 (reliable timing).
  workflow_dispatch:
  # Backup: GitHub's own timer. Often late, but it fills any hour that was
  # missed. The script skips hours that are already logged, so no duplicates.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: lanier-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Take reading
        run: python3 lanier_logger.py --once --skip-if-logged --file data/lake_lanier_log.csv

      - name: Save tables to the repository
        run: |
          git config user.name "lanier-logger"
          git config user.email "lanier-logger@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Reading $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
